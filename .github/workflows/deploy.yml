name: Deploy DailyOps

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which folders changed
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "push" ] \
             || [ -z "${BEFORE_SHA:-}" ] \
             || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            echo "Cannot diff (event=$EVENT_NAME) -> deploying both."
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          if echo "$CHANGED" | grep -q '^backend/'; then
            echo "backend=true"  >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -q '^frontend/'; then
            echo "frontend=true"  >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  # ----- backend
  backend:
    name: Backend -> ECR -> ECS
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Typecheck before building the image
        working-directory: backend
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.json

      - name: Assume the AWS deploy role (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-dailyops-be-${{ github.run_id }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Immutable tag
          IMAGE="$REGISTRY/$REPOSITORY:$SHA"

          # Must match X86_64 runtime
          docker build --platform linux/amd64 -t "$IMAGE" ./backend
          docker push "$IMAGE"

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)
          echo "IMAGE=$IMAGE"   >> "$GITHUB_ENV"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "Pushed $IMAGE ($DIGEST)"

      - name: Point the service at the new image
        env:
          SERVICE_ARN: ${{ vars.ECS_SERVICE_ARN }}
        run: |
          set -euo pipefail
          # Read-modify-write: the API replaces primaryContainer wholesale
          CURRENT=$(aws ecs describe-express-gateway-service \
            --service-arn "$SERVICE_ARN" \
            --query 'service.activeConfigurations[0].primaryContainer' \
            --output json)

          echo "Current container config:"
          echo "$CURRENT" | jq '{containerPort, environment: [.environment[].name], secrets: [.secrets[].name]}'

          UPDATED=$(echo "$CURRENT" | jq --arg img "$IMAGE" '.image = $img')

          # Guard: both bindings must survive by name
          for want in DATABASE_URL JWT_SECRET; do
            echo "$UPDATED" | jq -e --arg n "$want" '.secrets[] | select(.name == $n)' >/dev/null \
              || { echo "::error::Secret binding $want missing - refusing to deploy"; exit 1; }
          done

          # Guard: the gateway listener must keep matching
          [ "$(echo "$UPDATED" | jq '.containerPort')" = "4000" ] \
            || { echo "::error::containerPort changed - refusing to deploy"; exit 1; }

          # Transient API throttling should not fail a deploy
          for attempt in 1 2 3; do
            if aws ecs update-express-gateway-service \
                 --service-arn "$SERVICE_ARN" \
                 --primary-container "$UPDATED"; then
              echo "Service updated."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::update-express-gateway-service failed after 3 attempts"
          exit 1

      - name: Wait for the rollout
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE_NAME }}
        run: |
          set -euo pipefail
          # Canary bake can exceed the built-in waiter
          for i in $(seq 1 60); do
            STATE=$(aws ecs describe-services \
              --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].deployments[0].rolloutState' --output text)
            echo "[$i/60] rollout: $STATE"
            case "$STATE" in
              COMPLETED)
                echo "Deployment succeeded."
                exit 0 ;;
              FAILED)
                echo "::error::Deployment failed. The circuit breaker rolled back to the previous image."
                exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Timed out after 20 minutes waiting for the rollout."
          exit 1

      - name: Verify the live API
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /tmp/ready.json -w "%{http_code}" "$API_URL/health/ready" || echo 000)
            echo "attempt $i: HTTP $CODE $(cat /tmp/ready.json 2>/dev/null || true)"
            if [ "$CODE" = "200" ] && grep -q '"database":"up"' /tmp/ready.json; then
              echo "Backend is healthy and connected to the database."
              exit 0
            fi
            sleep 10
          done
          echo "::error::/health/ready did not report a healthy database."
          exit 1

      - name: Record what shipped
        if: always()
        run: |
          {
            echo "### Backend deployment"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Digest | \`${DIGEST:-image not built}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ----- frontend
  frontend:
    name: Frontend -> S3 -> CloudFront
    needs: [changes, backend]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.frontend == 'true' &&
      needs.backend.result != 'failure' &&
      needs.backend.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: npm run build

      - name: Verify the bundle
        working-directory: frontend
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }

          COUNT=$(ls -1 dist/assets/*.js 2>/dev/null | wc -l)
          [ "$COUNT" -ge 1 ] || { echo "::error::no JS bundle produced"; exit 1; }

          # Unset VITE_API_URL silently breaks the bundle
          if grep -rq "localhost:4000" dist/assets/*.js; then
            echo "::error::VITE_API_URL was not applied - the bundle still targets localhost:4000."
            exit 1
          fi
          grep -rqF "$API_URL" dist/assets/*.js \
            || { echo "::error::The expected API URL is not present in the built bundle."; exit 1; }

          # Nothing server-side may reach the browser
          for bad in JWT_SECRET DATABASE_URL 'postgresql://' AKIA; do
            if grep -rq "$bad" dist/assets/*.js dist/index.html; then
              echo "::error::Possible secret '$bad' found in the frontend bundle."
              exit 1
            fi
          done
          echo "Bundle verified: $COUNT JS file(s)"

      - name: Assume the AWS deploy role (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-dailyops-fe-${{ github.run_id }}

      - name: Upload to S3
        working-directory: frontend
        env:
          BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          set -euo pipefail
          # Hashed assets: cache forever
          aws s3 sync dist "s3://$BUCKET" \
            --delete --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

          # index.html: never cache
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate the CloudFront cache
        env:
          DIST_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          echo "Invalidation $ID created. Edge caches clear in 1-3 minutes."

      - name: Verify the live site
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          set -euo pipefail
          # Deep link tests the SPA rewrite
          for p in "/" "/leads"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL$p")
            echo "  $p -> HTTP $CODE"
            [ "$CODE" = "200" ] || { echo "::error::$p returned $CODE"; exit 1; }
          done
          echo "Frontend is live."

      - name: Record what shipped
        if: always()
        run: |
          {
            echo "### Frontend deployment"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Backend job | \`${{ needs.backend.result }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
